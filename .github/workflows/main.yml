name: Generate V2Ray Link

on:
  workflow_dispatch:
    inputs:
      remark:
        description: 'نام کانفیگ'
        required: false
        default: 'V2Ray-Config'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate V2Ray Link
        run: |
          # دریافت نام کانفیگ از ورودی
          REMARK="${{ github.event.inputs.remark }}"
          
          # تولید UUID تصادفی
          UUID=$(cat /proc/sys/kernel/random/uuid)
          
          # ساخت JSON کانفیگ VMess
          # نکته: آدرس (add) را روی یک دامنه فرضی گذاشتیم. برای استفاده واقعی باید آن را تغییر دهی.
          CONFIG=$(jq -n \
            --arg ps "$REMARK" \
            --arg id "$UUID" \
            '{
              "v": "2",
              "ps": $ps,
              "add": "example.com",
              "port": "443",
              "id": $id,
              "aid": "0",
              "net": "ws",
              "type": "none",
              "host": "",
              "path": "/",
              "tls": "tls"
            }')
          
          # تبدیل JSON به Base64
          ENCODED=$(echo -n "$CONFIG" | base64 -w 0)
          
          # ساخت لینک نهایی
          LINK="vmess://${ENCODED}"
          
          # ذخیره لینک در فایل
          echo "$LINK" > v2ray_link.txt
          
          # نمایش لینک در لاگ
          echo "Generated Link: $LINK"

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add v2ray_link.txt
          git commit -m "Update V2Ray link" || true
          git push
